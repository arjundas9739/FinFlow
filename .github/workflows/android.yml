name: Build Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies & Sync Capacitor
        run: |
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6
          node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Native APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinFlow-Native-SMS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
